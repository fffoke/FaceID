<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>КПП — FacePanel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script th:src="@{/js/sockjs.min.js}"></script>
    <script th:src="@{/js/stomp.min.js}"></script>

    <link rel="stylesheet" th:href="@{/css/common.css}">

    <style>
        /*
         * Все камеры видны всегда: страница занимает ровно экран, а размер плиток
         * подбирается скриптом (fitGrid) так, чтобы влезли все камеры без прокрутки.
         * Справа — общая лента распознаваний со всех камер.
         */
        html, body {
            height: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .kpp-layout {
            flex: 1;
            min-height: 0;
            display: flex;
            gap: 10px;
            padding: 10px;
        }

        .cams {
            flex: 1;
            min-width: 0;
            min-height: 0;
            display: grid;
            gap: 8px;
            justify-content: center;
            align-content: center;
        }

        .cam-tile {
            position: relative;
            aspect-ratio: 4 / 3;
            background: #000;
            border: 2px solid var(--border);
            border-radius: var(--radius-md);
            overflow: hidden;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        /* Камера только что кого-то распознала */
        .cam-tile.hit {
            border-color: var(--success);
            box-shadow: 0 0 24px rgba(16, 185, 129, 0.35);
        }

        .cam-tile img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .cam-offline {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            text-align: center;
            color: var(--text-dim);
            font-size: 0.78rem;
        }

        .cam-label {
            position: absolute;
            top: 6px;
            left: 6px;
            max-width: calc(100% - 12px);
            padding: 0.25em 0.75em;
            border-radius: var(--radius-pill);
            background: rgba(6, 9, 15, 0.7);
            color: var(--text-primary);
            font-size: var(--tile-font, 12px);
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .cam-label:hover { color: var(--accent-light); }

        .cam-hit-name {
            position: absolute;
            left: 6px;
            right: 6px;
            bottom: 6px;
            padding: 0.3em 0.8em;
            border-radius: var(--radius-sm);
            background: rgba(16, 185, 129, 0.85);
            color: #fff;
            font-size: var(--tile-font, 12px);
            font-weight: 700;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: none;
        }

        .cam-tile.hit .cam-hit-name { display: block; }

        /* Камера скрыта фильтром */
        .cam-tile.off { display: none; }

        .cams-empty {
            color: var(--text-muted);
            text-align: center;
            font-size: 0.9rem;
        }

        /* Общая лента распознаваний */
        .log {
            flex: none;
            width: clamp(220px, 18vw, 340px);
            min-height: 0;
            display: flex;
            flex-direction: column;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 10px;
            position: relative;
        }

        .log-head {
            flex: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .log h3 {
            margin: 0;
            font-size: 0.82rem;
            color: var(--text-secondary);
        }

        .filter-btn {
            padding: 6px 10px;
            border-radius: var(--radius-pill);
            border: 1px solid var(--border-hover);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-secondary);
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        .filter-btn:hover { color: var(--text-primary); }
        .filter-btn.partial { border-color: var(--accent-border); color: var(--accent-light); }

        /* Выбор камер — поверх ленты */
        .filter-panel {
            position: absolute;
            top: 46px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            z-index: 5;
            display: none;
            flex-direction: column;
            gap: 6px;
            background: var(--bg-elevated);
            border: 1px solid var(--border-hover);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-md);
            padding: 10px;
        }

        .filter-panel.open { display: flex; }

        .filter-actions {
            flex: none;
            display: flex;
            gap: 6px;
        }

        .filter-actions button {
            flex: 1;
            padding: 6px 8px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-secondary);
            font-size: 0.75rem;
            cursor: pointer;
        }

        .filter-list {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .filter-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 6px;
            border-radius: var(--radius-sm);
            font-size: 0.8rem;
            color: var(--text-primary);
            cursor: pointer;
        }

        .filter-item:hover { background: rgba(255, 255, 255, 0.04); }

        .filter-item input {
            width: 16px;
            height: 16px;
            flex: none;
            accent-color: var(--accent);
        }

        .filter-item small {
            color: var(--text-muted);
            font-size: 0.72rem;
        }

        .log-list {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .log-item {
            flex: none;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 6px 9px;
        }

        .log-name {
            color: var(--text-primary);
            font-weight: 600;
            font-size: 0.8rem;
            overflow-wrap: anywhere;
        }

        .log-meta {
            display: flex;
            justify-content: space-between;
            gap: 6px;
            margin-top: 2px;
            font-size: 0.72rem;
            color: var(--text-muted);
        }

        .log-meta span:first-child {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .log-time {
            color: var(--accent-light);
            font-family: 'SF Mono', 'Fira Code', monospace;
            white-space: nowrap;
        }

        .log-empty {
            color: var(--text-dim);
            font-size: 0.78rem;
            text-align: center;
            padding: 8px;
        }

        /* Узкий экран: камеры сверху, лента снизу на четверть высоты */
        @media (max-width: 768px) {
            .kpp-layout { flex-direction: column; padding: 8px; gap: 8px; }
            .log { width: auto; height: 28vh; }
        }
    </style>
</head>

<body>

    <div th:replace="~{fragments/header :: header}"></div>

    <div class="kpp-layout">
        <div class="cams" id="cams">
            <div th:each="cam : ${cameras}" class="cam-tile"
                th:attr="data-camera=${cam.name},data-slug=${cam.slug},data-building=${cam.building}">
                <img th:if="${cam.resolveStreamUrl() != null}" alt="Камера" style="display: none;"
                    th:attr="data-snapshot=@{/kpp/snapshot/{n}(n=${cam.slug})}">
                <div class="cam-offline"
                    th:text="${cam.resolveStreamUrl() != null} ? 'Подключение...' : 'Нет видео'">Подключение...</div>
                <a class="cam-label" th:href="@{/kpp/{n}(n=${cam.slug})}"
                    th:text="${cam.building != null and cam.building != ''} ? ${cam.name} + ' · ' + ${cam.building} : ${cam.name}">KPP1</a>
                <div class="cam-hit-name"></div>
            </div>

            <div th:if="${cameras == null or cameras.isEmpty()}" class="cams-empty">
                Нет камер — добавьте их на странице <a href="/cameras" style="color: var(--accent);">Камеры</a>
            </div>
            <div class="cams-empty" id="cams-all-off" style="display: none;">
                Все камеры скрыты — выберите нужные кнопкой «Камеры» справа
            </div>
        </div>

        <aside class="log">
            <div class="log-head">
                <h3>Распознавания</h3>
                <button type="button" class="filter-btn" id="filter-btn"
                    th:if="${cameras != null and !cameras.isEmpty()}">Камеры</button>
            </div>
            <div class="filter-panel" id="filter-panel">
                <div class="filter-actions">
                    <button type="button" id="filter-all">Все</button>
                    <button type="button" id="filter-none">Ни одной</button>
                </div>
                <div class="filter-list" id="filter-list"></div>
            </div>
            <div class="log-list" id="log-list">
                <div class="log-empty">Пока нет распознаваний</div>
            </div>
        </aside>
    </div>

    <script>
        const HIT_TIMEOUT_MS = 2000;
        const MAX_LOG_ITEMS = 50;
        const ASPECT = 4 / 3;
        const GAP = 8;

        const camsEl = document.getElementById('cams');
        const logEl = document.getElementById('log-list');
        const tiles = Array.from(document.querySelectorAll('.cam-tile'));
        const hitTimers = {};

        function visibleTiles() {
            return tiles.filter(function (t) { return !t.classList.contains('off'); });
        }

        // --- Раскладка: перебираем число колонок и берём то, при котором плитка
        // крупнее всего, но все камеры влезают и по ширине, и по высоте
        function fitGrid() {
            const n = visibleTiles().length;
            document.getElementById('cams-all-off').style.display = (tiles.length && !n) ? '' : 'none';
            if (!n) return;
            const w = camsEl.clientWidth;
            const h = camsEl.clientHeight;
            let best = { cols: 1, size: 0 };
            for (let cols = 1; cols <= n; cols++) {
                const rows = Math.ceil(n / cols);
                const byWidth = (w - GAP * (cols - 1)) / cols;
                const byHeight = (h - GAP * (rows - 1)) / rows * ASPECT;
                const size = Math.min(byWidth, byHeight);
                if (size > best.size) best = { cols: cols, size: size };
            }
            const tileW = Math.max(80, Math.floor(best.size));
            camsEl.style.gridTemplateColumns = 'repeat(' + best.cols + ', ' + tileW + 'px)';
            // Подписи на плитке растут и уменьшаются вместе с ней
            camsEl.style.setProperty('--tile-font', Math.max(9, Math.min(14, tileW / 20)) + 'px');
        }

        new ResizeObserver(fitGrid).observe(camsEl);
        fitGrid();

        // --- Превью: кадры по одному через /kpp/snapshot (MJPEG на каждую камеру
        // упёрся бы в лимит 6 соединений на хост). Следующий кадр — только после
        // прихода предыдущего, поэтому медленная сеть снижает частоту, а не копит запросы
        const SNAPSHOT_INTERVAL_MS = 500;
        const SNAPSHOT_RETRY_MS = 3000;

        function startPreview(img) {
            const base = img.getAttribute('data-snapshot');
            const offline = img.parentElement.querySelector('.cam-offline');
            let timer = null;

            function next(delay) {
                clearTimeout(timer);
                timer = setTimeout(load, delay);
            }

            function load() {
                // Вкладка в фоне — не гоняем трафик, вернёмся по visibilitychange.
                // Скрытая фильтром камера тоже не грузится — её разбудит applyFilter
                if (document.hidden || img.parentElement.classList.contains('off')) return;
                img.src = base + '?t=' + Date.now();
            }

            img.addEventListener('load', function () {
                img.style.display = '';
                offline.style.display = 'none';
                next(SNAPSHOT_INTERVAL_MS);
            });

            img.addEventListener('error', function () {
                img.style.display = 'none';
                offline.style.display = '';
                offline.textContent = 'Видео недоступно';
                next(SNAPSHOT_RETRY_MS);
            });

            document.addEventListener('visibilitychange', function () {
                if (!document.hidden) next(0);
            });

            img.wake = function () { next(0); };

            // Через таймер, а не сразу: к этому моменту фильтр уже пометит скрытые камеры
            next(0);
        }

        document.querySelectorAll('.cam-tile img[data-snapshot]').forEach(startPreview);

        // --- Фильтр камер. Храним в браузере именно скрытые, а не показанные:
        // так новая камера из реестра сразу появится на всех экранах.
        // У каждого планшета/монитора свой набор — он смотрит на свой КПП
        const FILTER_KEY = 'kpp.hiddenCameras';
        const filterBtn = document.getElementById('filter-btn');
        const filterPanel = document.getElementById('filter-panel');
        const filterList = document.getElementById('filter-list');

        function loadHidden() {
            try {
                return new Set(JSON.parse(localStorage.getItem(FILTER_KEY) || '[]'));
            } catch (e) {
                return new Set();
            }
        }

        let hidden = loadHidden();

        function applyFilter() {
            tiles.forEach(function (t) {
                const wasOff = t.classList.contains('off');
                const off = hidden.has(t.getAttribute('data-slug'));
                t.classList.toggle('off', off);
                const img = t.querySelector('img[data-snapshot]');
                if (wasOff && !off && img && img.wake) img.wake();
            });
            filterList.querySelectorAll('input').forEach(function (box) {
                box.checked = !hidden.has(box.value);
            });
            if (filterBtn) {
                const shown = visibleTiles().length;
                filterBtn.textContent = 'Камеры ' + shown + '/' + tiles.length;
                filterBtn.classList.toggle('partial', shown < tiles.length);
            }
            fitGrid();
        }

        function saveHidden() {
            localStorage.setItem(FILTER_KEY, JSON.stringify(Array.from(hidden)));
            applyFilter();
        }

        tiles.forEach(function (t) {
            const slug = t.getAttribute('data-slug');
            const label = document.createElement('label');
            label.className = 'filter-item';
            const box = document.createElement('input');
            box.type = 'checkbox';
            box.value = slug;
            box.addEventListener('change', function () {
                if (box.checked) hidden.delete(slug); else hidden.add(slug);
                saveHidden();
            });
            const text = document.createElement('span');
            text.textContent = t.getAttribute('data-camera');
            const building = t.getAttribute('data-building');
            if (building) {
                const small = document.createElement('small');
                small.textContent = ' · ' + building;
                text.appendChild(small);
            }
            label.appendChild(box);
            label.appendChild(text);
            filterList.appendChild(label);
        });

        if (filterBtn) {
            filterBtn.addEventListener('click', function () {
                filterPanel.classList.toggle('open');
            });
        }

        document.getElementById('filter-all').addEventListener('click', function () {
            hidden = new Set();
            saveHidden();
        });

        document.getElementById('filter-none').addEventListener('click', function () {
            hidden = new Set(tiles.map(function (t) { return t.getAttribute('data-slug'); }));
            saveHidden();
        });

        // Клик мимо панели закрывает её
        document.addEventListener('click', function (e) {
            if (filterPanel.classList.contains('open') && !filterPanel.contains(e.target) && e.target !== filterBtn) {
                filterPanel.classList.remove('open');
            }
        });

        applyFilter();

        // --- Распознавания: подсветка плитки + запись в общую ленту
        function showRecognition(data) {
            const cameraName = data.cameraName || 'Без камеры';
            const personName = data.personName && data.personName.trim() !== '' ? data.personName : 'Неизвестный';
            const time = new Date(data.timestamp || Date.now());
            const timeStr = time.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

            const tile = tiles.find(function (t) { return t.getAttribute('data-camera') === cameraName; });
            if (tile) {
                tile.querySelector('.cam-hit-name').textContent = personName;
                tile.classList.add('hit');
                clearTimeout(hitTimers[cameraName]);
                hitTimers[cameraName] = setTimeout(function () { tile.classList.remove('hit'); }, HIT_TIMEOUT_MS);
            }

            const empty = logEl.querySelector('.log-empty');
            if (empty) empty.remove();

            const item = document.createElement('div');
            item.className = 'log-item';
            const nameEl = document.createElement('div');
            nameEl.className = 'log-name';
            nameEl.textContent = personName;
            const meta = document.createElement('div');
            meta.className = 'log-meta';
            const camEl = document.createElement('span');
            camEl.textContent = cameraName;
            const timeEl = document.createElement('span');
            timeEl.className = 'log-time';
            timeEl.textContent = timeStr;
            meta.appendChild(camEl);
            meta.appendChild(timeEl);
            item.appendChild(nameEl);
            item.appendChild(meta);
            logEl.prepend(item);

            while (logEl.children.length > MAX_LOG_ITEMS) {
                logEl.removeChild(logEl.lastChild);
            }
        }

        function connectWs() {
            const socket = new SockJS('/ws');
            const stompClient = Stomp.over(socket);
            stompClient.debug = null;
            const headerStatus = document.getElementById('connection-status');

            stompClient.connect({}, function () {
                headerStatus.innerHTML = '<span>Подключено</span>';
                headerStatus.className = 'connection-status connected';
                stompClient.subscribe('/topic/attendance', function (message) {
                    try {
                        showRecognition(JSON.parse(message.body));
                    } catch (e) { console.error('Bad message', e); }
                });
            }, function () {
                headerStatus.innerHTML = '<span>Отключено</span>';
                headerStatus.className = 'connection-status disconnected';
                setTimeout(connectWs, 3000);
            });
        }

        connectWs();
    </script>

</body>

</html>
