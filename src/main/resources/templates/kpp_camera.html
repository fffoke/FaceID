<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="'КПП ' + ${cameraName} + ' — FacePanel'">КПП — FacePanel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script th:src="@{/js/sockjs.min.js}"></script>
    <script th:src="@{/js/stomp.min.js}"></script>

    <link rel="stylesheet" th:href="@{/css/common.css}">

    <style>
        /*
         * Экран рассчитан на планшет/монитор у турникета: видео и статус должны
         * помещаться в один экран без прокрутки. Альбомная ориентация — видео слева,
         * статус и лента справа; книжная — видео сверху, статус под ним.
         */
        html, body {
            height: 100%;
        }

        body {
            background: radial-gradient(ellipse at top, #0f1624 0%, var(--bg-primary) 60%);
            overflow: hidden;
        }

        .kpp-wrapper {
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 10px 12px;
            box-sizing: border-box;
        }

        .kpp-top {
            flex: none;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--accent);
            font-weight: 500;
            font-size: 0.85rem;
            padding: 6px 0;
            white-space: nowrap;
            transition: opacity var(--transition);
        }

        .back-link:hover { opacity: 0.7; }

        .kpp-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Переключатель камер — в одной строке с заголовком, прокручивается вбок */
        .kpp-switcher {
            display: flex;
            gap: 6px;
            margin-left: auto;
            overflow-x: auto;
            max-width: 100%;
        }

        .kpp-btn {
            padding: 6px 14px;
            border-radius: var(--radius-pill);
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            white-space: nowrap;
            transition: all var(--transition);
        }

        .kpp-btn.active {
            background: linear-gradient(135deg, var(--accent), #6366f1);
            color: #fff;
            border-color: var(--accent);
        }

        .kpp-btn:hover:not(.active) {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-secondary);
        }

        .building-tag {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--accent-light);
            background: var(--accent-subtle);
            border: 1px solid var(--accent-border);
            padding: 3px 10px;
            border-radius: var(--radius-pill);
            white-space: nowrap;
        }

        .kpp-main {
            flex: 1;
            min-height: 0;
            display: grid;
            grid-template-columns: minmax(0, 1.7fr) minmax(280px, 1fr);
            gap: 10px;
        }

        .kpp-main.no-video {
            grid-template-columns: minmax(0, 720px);
            justify-content: center;
        }

        /* Видеопоток с камеры */
        .video-card {
            min-height: 0;
            position: relative;
            background: #000;
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            overflow: hidden;
        }

        .video-card img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .video-offline {
            position: absolute;
            inset: 0;
            align-items: center;
            justify-content: center;
            color: var(--text-dim);
            font-size: 0.85rem;
            padding: 24px;
            text-align: center;
        }

        .side {
            min-height: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .status-card {
            flex: none;
            border-radius: var(--radius-xl);
            padding: 14px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-lg);
            text-align: center;
        }

        .status-main {
            border-radius: var(--radius-lg);
            padding: 24px 14px;
            transition: all 0.3s ease;
        }

        .status-main.idle {
            background: rgba(100, 116, 139, 0.08);
            border: 1px solid rgba(100, 116, 139, 0.2);
        }

        .status-main.active {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.5);
            box-shadow: 0 0 40px rgba(16, 185, 129, 0.15), inset 0 0 0 1px rgba(16, 185, 129, 0.2);
        }

        .status-title {
            font-size: clamp(1.25rem, 2.6vw, 2rem);
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
            overflow-wrap: anywhere;
        }

        .status-title.idle { color: var(--text-secondary); }
        .status-title.active { color: #ecfdf5; }

        .status-subtitle {
            font-size: clamp(0.85rem, 1.4vw, 1.05rem);
            color: var(--text-muted);
        }

        .status-subtitle span {
            font-weight: 600;
            color: var(--text-primary);
        }

        .status-meta {
            margin-top: 10px;
            font-size: 0.78rem;
            color: var(--text-dim);
        }

        .status-meta strong { color: var(--text-secondary); }

        /* Лента последних распознаваний забирает остаток высоты и прокручивается сама */
        .feed-card {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            padding: 12px;
        }

        .feed-card h3 {
            flex: none;
            margin: 0 0 8px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .cam-feed {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
            overflow-y: auto;
        }

        .feed-item {
            flex: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 8px 12px;
            font-size: 0.85rem;
        }

        .feed-name {
            color: var(--text-primary);
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .feed-time {
            color: var(--accent-light);
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 0.78rem;
            white-space: nowrap;
        }

        .feed-empty {
            color: var(--text-dim);
            font-size: 0.82rem;
            text-align: center;
            padding: 8px;
        }

        /* Книжная ориентация: видео сверху, статус и лента под ним */
        @media (orientation: portrait) {
            .kpp-main {
                grid-template-columns: minmax(0, 1fr);
                grid-template-rows: minmax(0, 1.3fr) minmax(0, 1fr);
            }
            .kpp-main.no-video {
                grid-template-rows: minmax(0, 1fr);
            }
        }

        /* Телефон в книжной ориентации — всё в столбик с обычной прокруткой */
        @media (max-width: 600px) {
            html, body { height: auto; }
            body { overflow: auto; }
            .kpp-wrapper { height: auto; }
            .kpp-main, .kpp-main.no-video { display: flex; flex-direction: column; }
            .video-card { aspect-ratio: 4 / 3; }
            .cam-feed { max-height: 50vh; }
        }

        /* Телефон в альбомной ориентации — по высоте не уместить, даём прокрутку */
        @media (max-height: 480px) and (orientation: landscape) {
            html, body { height: auto; }
            body { overflow: auto; }
            .kpp-wrapper { height: auto; }
            .kpp-main { grid-template-columns: minmax(0, 1.4fr) minmax(240px, 1fr); }
            .video-card { height: calc(100dvh - 70px); }
            .cam-feed { max-height: 40vh; }
        }
    </style>
</head>

<body>

    <div class="kpp-wrapper">
        <div class="kpp-top">
            <a href="/kpp" class="back-link">&larr; Все КПП</a>
            <span class="kpp-title" th:text="${cameraName}">KPP1</span>
            <span class="building-tag" th:if="${building != null and building != ''}" th:text="${building}">Корпус</span>

            <!-- Переключатель между камерами -->
            <div class="kpp-switcher" th:if="${cameras != null and #lists.size(cameras) > 1}">
                <a th:each="cam : ${cameras}" th:href="@{/kpp/{n}(n=${cam.slug})}"
                    class="kpp-btn" th:classappend="${cam.name == cameraName} ? 'active'"
                    th:text="${cam.name}">KPP1</a>
            </div>
        </div>

        <div class="kpp-main" th:classappend="${!hasStream} ? 'no-video'">
            <!-- Живое видео с распознаванием (проксируется панелью) -->
            <div class="video-card" th:if="${hasStream}">
                <img alt="Видеопоток камеры" id="video-stream" th:attr="data-stream-base=@{/kpp/stream/{n}(n=${cameraKey})}">
                <div class="video-offline" id="video-offline" style="display: none;">
                    Видеопоток недоступен — переподключаюсь...
                </div>
            </div>

            <div class="side">
                <div class="status-card">
                    <div id="status-main" class="status-main idle">
                        <div id="status-title" class="status-title idle">
                            Нет лица для определения
                        </div>
                        <div id="status-subtitle" class="status-subtitle">
                            Ожидание появления лица в зоне камеры
                        </div>
                    </div>

                    <div class="status-meta">
                        Обновление: <span id="status-time">&mdash;</span>
                    </div>
                </div>

                <div class="feed-card">
                    <h3>Последние распознавания</h3>
                    <div class="cam-feed" id="cam-feed">
                        <div class="feed-empty">Пока нет распознаваний</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        const CAMERA_NAME = /*[[${cameraName}]]*/ 'KPP1';
        const STATUS_TIMEOUT_MS = 2000;
        const MAX_FEED_ITEMS = 20;

        let resetTimer = null;

        const statusMainEl = document.getElementById('status-main');
        const statusTitleEl = document.getElementById('status-title');
        const statusSubtitleEl = document.getElementById('status-subtitle');
        const statusTimeEl = document.getElementById('status-time');
        const feedEl = document.getElementById('cam-feed');

        function setIdleStatus() {
            statusMainEl.className = 'status-main idle';
            statusTitleEl.className = 'status-title idle';
            statusTitleEl.textContent = 'Нет лица для определения';
            statusSubtitleEl.textContent = 'Ожидание появления лица в зоне камеры';
        }

        function setActiveStatus(personName, timeStr) {
            statusMainEl.className = 'status-main active';
            statusTitleEl.className = 'status-title active';
            statusTitleEl.textContent = 'Определён: ' + personName;
            statusSubtitleEl.innerHTML = '';
            const label = document.createTextNode('Доступ разрешён: ');
            const nameSpan = document.createElement('span');
            nameSpan.textContent = personName;
            statusSubtitleEl.appendChild(label);
            statusSubtitleEl.appendChild(nameSpan);
            statusTimeEl.textContent = timeStr;
        }

        function addFeedItem(personName, timeStr) {
            const empty = feedEl.querySelector('.feed-empty');
            if (empty) empty.remove();

            const item = document.createElement('div');
            item.className = 'feed-item';
            const nameEl = document.createElement('span');
            nameEl.className = 'feed-name';
            nameEl.textContent = personName;
            const timeEl = document.createElement('span');
            timeEl.className = 'feed-time';
            timeEl.textContent = timeStr;
            item.appendChild(nameEl);
            item.appendChild(timeEl);
            feedEl.prepend(item);

            while (feedEl.children.length > MAX_FEED_ITEMS) {
                feedEl.removeChild(feedEl.lastChild);
            }
        }

        // --- Видеопоток: MJPEG через <img> держит одно долгоживущее соединение
        // и сам никогда не переподключается. Если оно где-то оборвётся (сетевой
        // глитч, рестарт python-клиента, таймаут прокси) — картинка застынет
        // навсегда без ошибки. Поэтому переоткрываем поток по таймеру и при onerror.
        const videoStreamEl = document.getElementById('video-stream');
        const videoOfflineEl = document.getElementById('video-offline');
        const STREAM_REFRESH_MS = 20000; // плановое переподключение — «на всякий случай»
        const STREAM_RETRY_MS = 3000;    // повтор при ошибке

        if (videoStreamEl) {
            const streamBase = videoStreamEl.getAttribute('data-stream-base');
            let refreshTimer = null;

            function reloadStream() {
                videoStreamEl.src = streamBase + '?t=' + Date.now();
            }

            videoStreamEl.addEventListener('load', function () {
                videoStreamEl.style.display = '';
                videoOfflineEl.style.display = 'none';
            });

            videoStreamEl.addEventListener('error', function () {
                videoStreamEl.style.display = 'none';
                videoOfflineEl.style.display = 'flex';
                setTimeout(reloadStream, STREAM_RETRY_MS);
            });

            reloadStream();
            refreshTimer = setInterval(reloadStream, STREAM_REFRESH_MS);
        }

        function connectWs() {
            const socket = new SockJS('/ws');
            const stompClient = Stomp.over(socket);
            stompClient.debug = null;

            stompClient.connect({}, function () {
                stompClient.subscribe('/topic/attendance', function (message) {
                    try {
                        const data = JSON.parse(message.body);
                        if (!data.cameraName || data.cameraName !== CAMERA_NAME) return;

                        const personName = data.personName && data.personName.trim() !== '' ? data.personName : 'Неизвестный';
                        const time = new Date(data.timestamp || Date.now());
                        const timeStr = time.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

                        setActiveStatus(personName, timeStr);
                        addFeedItem(personName, timeStr);

                        if (resetTimer) clearTimeout(resetTimer);
                        resetTimer = setTimeout(setIdleStatus, STATUS_TIMEOUT_MS);
                    } catch (e) { console.error('Bad message', e); }
                });
            }, function () { setTimeout(connectWs, 3000); });
        }

        setIdleStatus();
        connectWs();
    </script>

</body>

</html>
